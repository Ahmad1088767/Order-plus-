<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>تسجيل الدخول - Order Plus</title>
  <style>
    body { font-family: Tahoma; background: #fdf6e3; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; }
    input, button { width: 100%; padding: 10px; margin: 10px 0; font-size: 16px; }
    button { background: #fdd835; border: none; font-weight: bold; }
    .error { color: red; font-size: 14px; text-align: center; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2 style="text-align:center;">تسجيل الدخول</h2>
    <input type="email" id="email" placeholder="البريد الإلكتروني" />
    <input type="password" id="password" placeholder="كلمة المرور" />
    <button onclick="login()">دخول</button>
    <div class="error" id="error"></div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCC_eNddby6PXo0WRdIT5Lcv3zaXgNifc8",
      authDomain: "order-plus-98cb8.firebaseapp.com",
      projectId: "order-plus-98cb8",
      storageBucket: "order-plus-98cb8.appspot.com",
      messagingSenderId: "309110990760",
      appId: "1:309110990760:web:7894936e0c5358d4cddf9d"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      auth.signInWithEmailAndPassword(email, password)
        .then(() => window.location.href = 'index.html')
        .catch(() => document.getElementById('error').innerText = "بيانات الدخول غير صحيحة");
    }
  </script>
</body>
</html>
